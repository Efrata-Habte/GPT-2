# Tiny config: runs on CPU in a minute or two. Used for tests and smoke runs.
# (A `train:` section is added in Phase 4.)
model:
  n_layer: 2
  n_head: 2
  n_embd: 64
  block_size: 64
  dropout: 0.1
  pos_encoding: learned     # learned | sinusoidal
  norm_position: pre        # pre (GPT-2) | post (Vaswani)   [used from Phase 2]
  tie_weights: true         # [used from Phase 3]

data:
  path: data/input.txt
  tokenizer: char           # char | bpe
  bpe_vocab_size: 512       # only used when tokenizer == bpe
