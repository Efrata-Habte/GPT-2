# CPU-sized Amharic model (same architecture/budget as demo_english.yaml, so bits-per-character are comparable).
# Variants: --set data.normalize=homophones  (homophone-folded text)   data.tokenizer=bpe_char|bpe_byte
model:
  n_layer: 2
  n_head: 4
  n_embd: 128
  block_size: 128
  dropout: 0.1
  pos_encoding: learned
  norm_position: pre
  tie_weights: true

data:
  path: data/amharic/amharic.txt
  tokenizer: char
  bpe_vocab_size: 1000
  normalize: none

train:
  batch_size: 32
  max_iters: 2500
  eval_interval: 250
  eval_iters: 20
  log_interval: 10
  lr: 3.0e-3
  min_lr: 3.0e-4
  warmup_iters: 100
  weight_decay: 0.1
  grad_clip: 1.0
  mixed_precision: false
  seed: 1337
  out_dir: checkpoints/demo_amharic
