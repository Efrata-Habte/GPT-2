# Experiment 3 (training dynamics): the "small" model with dropout OFF and frequent evaluation,
# so the train/val gap opens and the point where validation loss turns upward is visible.
# ~Same cost as small.yaml (~30 min on a T4).
model:
  n_layer: 6
  n_head: 6
  n_embd: 384
  block_size: 256
  dropout: 0.0
  pos_encoding: learned
  norm_position: pre
  tie_weights: true

data:
  path: data/input.txt
  tokenizer: char
  bpe_vocab_size: 512

train:
  batch_size: 64
  max_iters: 3000
  eval_interval: 50
  eval_iters: 50
  log_interval: 10
  lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_iters: 100
  weight_decay: 0.1
  grad_clip: 1.0
  mixed_precision: true
  seed: 1337
  out_dir: checkpoints/exp_overfit
