# Shared base for the SWEEP experiments (4 architecture, 5 norm, 6 positional encoding,
# 7 tokenizer, 8 scaling). Each experiment script varies only its own key(s) on top of this.
# Deliberately cheaper than small.yaml (half the context, half the steps) so a whole sweep
# of 3-5 runs fits in roughly 30-40 min on a Colab T4. Check tokens_per_sec and adjust with
#   --set train.max_iters=...
model:
  n_layer: 4
  n_head: 4
  n_embd: 256
  block_size: 128
  dropout: 0.1
  pos_encoding: learned
  norm_position: pre
  tie_weights: true

data:
  path: data/input.txt
  tokenizer: char
  bpe_vocab_size: 512

train:
  batch_size: 64
  max_iters: 1500
  eval_interval: 100
  eval_iters: 30
  log_interval: 10
  lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_iters: 100
  weight_decay: 0.1
  grad_clip: 1.0
  mixed_precision: true
  seed: 1337
  out_dir: checkpoints/exp_base   # sweep scripts override this per run
