# Experiment 4 (architecture sweep): a cheaper base than small.yaml (half the context, half the steps) so the 3 runs of
# a sweep fit a T4 session. exp4_architecture.py varies ONE of model.n_layer {2,4,6}, model.n_head, model.n_embd.
model:
  n_layer: 4
  n_head: 4
  n_embd: 256
  block_size: 128
  dropout: 0.1
  pos_encoding: learned
  norm_position: pre
  tie_weights: true

data:
  path: data/input.txt
  tokenizer: char
  bpe_vocab_size: 512

train:
  batch_size: 64
  max_iters: 1500
  eval_interval: 100
  eval_iters: 30
  log_interval: 10
  lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_iters: 100
  weight_decay: 0.1
  grad_clip: 1.0
  mixed_precision: true
  seed: 1337
  out_dir: checkpoints/exp4_architecture   # sweep scripts override this per run
