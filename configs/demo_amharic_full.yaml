# CPU demo model on the FULL Amharic data (Wikipedia + news, 3.3x the news corpus); identical to demo_amharic.yaml otherwise.
# Build the corpus first: python -I data/amharic/prepare_wikipedia.py
model:
  n_layer: 2
  n_head: 4
  n_embd: 128
  block_size: 128
  dropout: 0.1
  pos_encoding: learned
  norm_position: pre
  tie_weights: true

data:
  path: data/amharic/amharic_full.txt
  tokenizer: char
  bpe_vocab_size: 1000
  normalize: none

train:
  batch_size: 32
  max_iters: 2500
  eval_interval: 250
  eval_iters: 20
  log_interval: 10
  lr: 3.0e-3
  min_lr: 3.0e-4
  warmup_iters: 100
  weight_decay: 0.1
  grad_clip: 1.0
  mixed_precision: false
  seed: 1337
  out_dir: checkpoints/demo_amharic_full
