[server]
enableStaticServing = true   # serves app/static/ (the bundled Noto Sans Ethiopic font) at /app/static/

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161A26"
textColor = "#E6E8F2"
baseRadius = "0.6rem"
borderColor = "#2A3045"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#121522"
